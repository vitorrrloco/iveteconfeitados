<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#563044">
<meta name="description" content="Gestão da Ivete Confeitados">
<link rel="manifest" href="./manifest.json">
<title>Ivete Confeitados</title>
<style>
:root{--wine:#563044;--wine2:#70465e;--rose:#f5e9ee;--bg:#faf7f8;--ink:#30252b;--muted:#827780;--line:#eee4e9;--red:#b84d5d;--green:#287653}
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;min-height:100%;overflow-x:hidden}body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:not--allowed}
.app{min-height:100vh;display:flex;width:100%;max-width:100%}.sidebar{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{padding:4px 8px 18px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--rose);display:grid;place-items:center;color:var(--wine);font-weight:800}.brand strong{display:block;color:var(--wine)}.brand small{color:var(--muted)}
.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#6e6068;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:var(--rose);color:var(--wine);font-weight:700}.nav-icon{width:22px;text-align:center;font-size:17px}.side-foot{margin-top:auto;color:#988b92;font-size:11px;padding:8px}
.main{min-width:0;flex:1;width:calc(100% - 250px)}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:4}.topbar-left,.top-actions{display:flex;align-items:center;gap:10px}.topbar h2{font-size:16px;margin:0;color:var(--wine)}.today{font-size:12px;background:var(--rose);padding:7px 10px;border-radius:30px;color:var(--wine)}.content{width:100%;max-width:1450px;margin:auto;padding:26px}
.btn{border:0;border-radius:9px;background:var(--wine);color:white;padding:10px 14px;font-weight:650}.btn:hover{background:var(--wine2)}.btn.light{background:var(--rose);color:var(--wine)}.btn.outline{background:white;color:var(--wine);border:1px solid var(--line)}.btn.danger{background:#fff0f1;color:var(--red)}.menu-toggle{display:none}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}.page-head h1{margin:0 0 4px;color:var(--wine);font-size:25px;line-height:1.2}.muted{color:var(--muted)}.page-head p{margin:0;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 4px 18px #56304408}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:25px;font-weight:800;color:var(--wine);margin:6px 0 2px}.metric-foot{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}.panel h3{margin:0 0 13px;color:var(--wine);font-size:16px}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.quick button{border:1px solid var(--line);border-radius:10px;background:#fffafd;padding:13px;text-align:left;color:var(--wine)}.quick button strong{display:block;margin-top:4px}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fcf9fa}td strong{color:var(--ink)}.actions{display:flex;gap:5px;white-space:nowrap}.smallbtn{border:1px solid var(--line);background:white;color:var(--wine);border-radius:7px;padding:6px 8px;font-size:11px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:340px}
input,select,textarea{width:100%;border:1px solid #e5dbe0;border-radius:8px;padding:10px;background:white;color:var(--ink);min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #d8a7b8;outline-offset:1px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#65545d}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.modal-back{position:fixed;inset:0;background:#24151d99;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:92dvh;overflow:auto;padding:20px;box-shadow:0 18px 60px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-head h3{margin:0;color:var(--wine)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.close{border:0;background:var(--rose);color:var(--wine);border-radius:8px;padding:7px 10px}.notice{background:#fff8e9;border:1px solid #f1e1bf;padding:12px;border-radius:10px;color:#73551d;font-size:13px;margin-bottom:14px}.status{font-size:11px;color:var(--muted)}
#authScreen{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;padding:18px}#authScreen .panel{width:min(420px,100%);padding:24px}#authScreen h1{text-align:center;color:var(--wine);font-size:23px}#authScreen p{text-align:center;color:var(--muted);font-size:13px}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:680px){
 .app{display:block}.sidebar{position:fixed;left:-270px;top:0;bottom:0;height:100dvh;width:260px;z-index:30;transition:left .2s;box-shadow:12px 0 35px #25141f22}.sidebar.open{left:0}.main{width:100%;max-width:100%}.topbar{height:60px;padding:0 13px}.menu-toggle{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0}.topbar h2{font-size:14px}.content{padding:18px 12px 35px}.page-head{align-items:flex-start;gap:8px}.page-head h1{font-size:21px}.page-head .btn{font-size:11px;padding:9px 10px;white-space:nowrap}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:12px}.metric{font-size:20px}.metric-label,.metric-foot{font-size:10px}.panel{padding:13px}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:minmax(0,1fr)}.modal-back{align-items:flex-end;padding:0}.modal{width:100%;max-height:90dvh;border-radius:16px 16px 0 0;padding:17px 14px calc(16px + env(safe-area-inset-bottom))}.modal-actions{position:sticky;bottom:-17px;background:white}.modal-actions .btn{flex:1}input,select,textarea{font-size:16px;min-height:43px}.table-wrap{margin:0}table{min-width:580px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">IC</div><div><strong>Ivete Confeitados</strong><small>Gestão da confeitaria</small></div></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="nav-icon">⌂</span>Visão geral</button>
  <button data-page="orders"><span class="nav-icon">▣</span>Encomendas</button>
  <button data-page="production"><span class="nav-icon">♨</span>Produção</button>
  <button data-page="products"><span class="nav-icon">◇</span>Produtos</button>
  <button data-page="recipes"><span class="nav-icon">▤</span>Receitas e custos</button>
  <button data-page="stock"><span class="nav-icon">▦</span>Estoque</button>
  <button data-page="finance"><span class="nav-icon">R$</span>Financeiro</button>
  <button data-page="customers"><span class="nav-icon">♙</span>Clientes</button>
  <button data-page="reports"><span class="nav-icon">▥</span>Relatórios</button>
  <button data-page="settings"><span class="nav-icon">⚙</span>Dados e backup</button>
 </nav>
 <div class="side-foot">Gestão simples para uma confeitaria organizada.</div>
</aside>
<main class="main">
 <header class="topbar"><div class="topbar-left"><button class="btn light menu-toggle" id="menuBtn" type="button">☰</button><h2 id="topTitle">Visão geral</h2></div><div class="top-actions"><span class="today" id="today"></span><button class="btn light" id="logoutBtn" type="button" style="display:none">Sair</button></div></header>
 <section class="content" id="content"></section>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Cadastro</h3><button class="close" id="closeModal" type="button">Fechar</button></div><div id="modalBody"></div><div class="modal-actions"><button class="btn outline" id="cancelModal" type="button">Cancelar</button><button class="btn" id="saveModal" type="button">Salvar</button></div></div></div>
<div id="authScreen"><div class="panel"><div class="brand-mark" style="margin:auto">IC</div><h1>Ivete Confeitados</h1><p>Entre para acessar os dados da confeitaria.</p><div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="authPassword" type="password" autocomplete="current-password"></div><div id="authError" style="color:#b84d5d;font-size:12px;margin:8px 0"></div><button class="btn" id="loginBtn" type="button" style="width:100%">Entrar</button><button class="btn light" id="registerBtn" type="button" style="width:100%;margin-top:8px">Criar minha conta</button></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toISOString().slice(0,10), fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const blank={ingredients:[],recipes:[],products:[],orders:[],customers:[],transactions:[]};
let db=load(),page='dashboard',formSave=null,cloudReady=false;
function load(){try{return {...blank,...JSON.parse(localStorage.getItem('ivete_data')||'{}')}}catch(e){return JSON.parse(JSON.stringify(blank))}}
function persist(){localStorage.setItem('ivete_data',JSON.stringify(db));if(cloudReady&&window.iveteCloudSave)window.iveteCloudSave(db)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(a,f){return a.reduce((t,x)=>t+f(x),0)}
const titles={dashboard:'Visão geral',orders:'Encomendas',production:'Produção',products:'Produtos',recipes:'Receitas e custos',stock:'Estoque',finance:'Financeiro',customers:'Clientes',reports:'Relatórios',settings:'Dados e backup'};
function setPage(p){if(!titles[p])return;page=p;$('#sidebar').classList.remove('open');$('#topTitle').textContent=titles[p];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){e.preventDefault();setPage(b.dataset.page)}});
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#today').textContent=new Date().toLocaleDateString('pt-BR');
function head(t,d,b,act){return `<div class="page-head"><div><h1>${t}</h1><p>${d}</p></div>${b?`<button class="btn" type="button" data-action="${act}">＋ ${b}</button>`:''}</div>`}
function table(h,rows){return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function render(){
 const c=$('#content');persist();
 if(page==='dashboard')c.innerHTML=dashboard();
 if(page==='stock')c.innerHTML=stock();
 if(page==='recipes')c.innerHTML=recipes();
 if(page==='products')c.innerHTML=products();
 if(page==='orders')c.innerHTML=orders();
 if(page==='production')c.innerHTML=production();
 if(page==='finance')c.innerHTML=finance();
 if(page==='customers')c.innerHTML=customers();
 if(page==='reports')c.innerHTML=reports();
 if(page==='settings')c.innerHTML=settings();
}
function dashboard(){
 const m=today().slice(0,7), sales=sum(db.orders.filter(o=>o.date?.startsWith(m)&&o.status!=='Cancelado'),o=>+o.total||0),inc=sum(db.transactions.filter(t=>t.type==='entrada'&&t.date?.startsWith(m)),t=>+t.value||0),out=sum(db.transactions.filter(t=>t.type==='saida'&&t.date?.startsWith(m)),t=>+t.value||0),pending=db.orders.filter(o=>!['Entregue','Cancelado'].includes(o.status)),low=db.ingredients.filter(i=>+i.qty<=+i.min);
 return head('Bom dia!','Aqui está o resumo da Ivete Confeitados.','Nova encomenda','create:orders')+`<div class="cards"><div class="card"><div class="metric-label">Vendas em pedidos no mês</div><div class="metric">${money(sales)}</div><div class="metric-foot">Pedidos não cancelados</div></div><div class="card"><div class="metric-label">Entradas recebidas</div><div class="metric">${money(inc)}</div><div class="metric-foot">Lançamentos financeiros</div></div><div class="card"><div class="metric-label">Despesas no mês</div><div class="metric">${money(out)}</div><div class="metric-foot">Saídas registradas</div></div><div class="card"><div class="metric-label">Pedidos em andamento</div><div class="metric">${pending.length}</div><div class="metric-foot">${low.length} ingrediente(s) com estoque baixo</div></div></div><div class="grid2"><div class="panel"><h3>Próximas encomendas</h3>${table(['Cliente / pedido','Entrega','Valor','Status'],pending.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,6).map(o=>`<tr><td><strong>${esc(o.customer)}</strong><br>${esc(o.product)}</td><td>${fmt(o.date)}</td><td>${money(o.total)}</td><td>${esc(o.status)}</td></tr>`).join('')||'')}</div><div class="panel"><h3>Acesso rápido</h3><div class="quick"><button data-action="create:orders">＋<strong>Encomenda</strong></button><button data-action="create:ingredients">＋<strong>Ingrediente</strong></button><button data-action="create:recipes">＋<strong>Receita</strong></button><button data-action="create:transactions">＋<strong>Lançamento</strong></button><button data-action="page:production">♨<strong>Produção</strong></button><button data-action="page:reports">▥<strong>Relatórios</strong></button></div><h3 style="margin-top:20px">Estoque para atenção</h3>${low.map(i=>`<p>${esc(i.name)}: <b>${i.qty} ${esc(i.unit)}</b></p>`).join('')||empty('Nenhum alerta de estoque.')}</div></div>`;
}
function stock(){return head('Estoque','Controle de ingredientes, quantidades, custos e validade.','Novo ingrediente','create:ingredients')+`<div class="panel">${table(['Ingrediente','Quantidade','Mínimo','Custo','Validade','Situação','Ações'],db.ingredients.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${i.qty} ${esc(i.unit)}</td><td>${i.min||0} ${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${fmt(i.expiry)}</td><td>${+i.qty<=+i.min?'Estoque baixo':'Disponível'}</td><td><div class="actions"><button class="smallbtn" data-action="edit:ingredients:${i.id}">Editar</button><button class="smallbtn" data-action="del:ingredients:${i.id}">Excluir</button></div></td></tr>`).join('')||'')}</div>`}
function recipeCost(r){return sum(r.items||[],x=>{const i=db.ingredients.find(i=>i.id===x.id);return i?(+i.cost||0)*(+x.qty||0):0})}
function recipes(){return head('Receitas e custos','Monte fichas técnicas e descubra o custo de cada receita.','Nova receita','create:recipes')+`<div class="panel">${table(['Receita','Rendimento','Ingredientes','Custo total','Custo por unidade','Ações'],db.recipes.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.yield||1} un.</td><td>${(r.items||[]).length}</td><td>${money(recipeCost(r))}</td><td>${money(recipeCost(r)/(+r.yield||1))}</td><td><div class="actions"><button class="smallbtn" data-action="edit:recipes:${r.id}">Editar</button><button class="smallbtn" data-action="del:recipes:${r.id}">Excluir</button></div></td></tr>`).join('')||'')}</div>`}
function products(){return head('Produtos','Catálogo e preços de venda.','Novo produto','create:products')+`<div class="panel">${table(['Produto','Categoria','Preço','Custo estimado','Margem','Ações'],db.products.map(p=>{const r=db.recipes.find(r=>r.id===p.recipeId),cost=r?recipeCost(r)/(+r.yield||1):+p.cost||0;return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category||'—')}</td><td>${money(p.price)}</td><td>${money(cost)}</td><td>${money((+p.price||0)-cost)}</td><td><div class="actions"><button class="smallbtn" data-action="edit:products:${p.id}">Editar</button><button class="smallbtn" data-action="del:products:${p.id}">Excluir</button></div></td></tr>`}).join('')||'')}</div>`}
function orders(){return head('Encomendas','Registre pedidos, sinais, datas e andamento.','Nova encomenda','create:orders')+`<div class="panel">${table(['Cliente','Produto / detalhes','Entrega','Total','Sinal','Status','Ações'],db.orders.map(o=>`<tr><td><b>${esc(o.customer)}</b><br>${esc(o.phone||'')}</td><td>${esc(o.product)}<br>${esc(o.notes||'')}</td><td>${fmt(o.date)}</td><td>${money(o.total)}</td><td>${money(o.deposit)}</td><td><select data-status="${o.id}">${['Aguardando','Confirmado','Em produção','Pronto','Entregue','Cancelado'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="actions"><button class="smallbtn" data-action="edit:orders:${o.id}">Editar</button><button class="smallbtn" data-action="del:orders:${o.id}">Excluir</button></div></td></tr>`).join('')||'')}</div>`}
function production(){const a=db.orders.filter(o=>['Confirmado','Em produção','Pronto'].includes(o.status));return head('Produção','Acompanhe o que precisa ser preparado e entregue.','Nova encomenda','create:orders')+`<div class="panel">${a.map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(o.product)}</b><p class="muted">${esc(o.customer)} · Entrega ${fmt(o.date)}</p><select data-status="${o.id}">${['Confirmado','Em produção','Pronto','Entregue'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||empty('Nenhuma encomenda na produção.')}</div>`}
function finance(){const m=today().slice(0,7),inc=sum(db.transactions.filter(t=>t.type==='entrada'&&t.date?.startsWith(m)),t=>+t.value||0),out=sum(db.transactions.filter(t=>t.type==='saida'&&t.date?.startsWith(m)),t=>+t.value||0);return head('Financeiro','Registre entradas e saídas para acompanhar o caixa.','Novo lançamento','create:transactions')+`<div class="cards"><div class="card"><div class="metric-label">Entradas do mês</div><div class="metric">${money(inc)}</div></div><div class="card"><div class="metric-label">Saídas do mês</div><div class="metric">${money(out)}</div></div><div class="card"><div class="metric-label">Saldo do mês</div><div class="metric">${money(inc-out)}</div></div><div class="card"><div class="metric-label">Lançamentos</div><div class="metric">${db.transactions.length}</div></div></div><div class="panel">${table(['Data','Descrição','Categoria','Tipo','Valor','Ações'],db.transactions.map(t=>`<tr><td>${fmt(t.date)}</td><td>${esc(t.description)}</td><td>${esc(t.category||'—')}</td><td>${esc(t.type)}</td><td>${money(t.value)}</td><td><button class="smallbtn" data-action="del:transactions:${t.id}">Excluir</button></td></tr>`).join('')||'')}</div>`}
function customers(){return head('Clientes','Contatos e histórico de relacionamento.','Novo cliente','create:customers')+`<div class="panel">${table(['Nome','Telefone','E-mail','Observações','Ações'],db.customers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.notes||'—')}</td><td><div class="actions"><button class="smallbtn" data-action="edit:customers:${x.id}">Editar</button><button class="smallbtn" data-action="del:customers:${x.id}">Excluir</button></div></td></tr>`).join('')||'')}</div>`}
function reports(){const m=today().slice(0,7),a=db.orders.filter(o=>o.date?.startsWith(m)&&o.status!=='Cancelado'),v=sum(a,o=>+o.total||0);return head('Relatórios','Resumo dos dados cadastrados.')+`<div class="cards"><div class="card"><div class="metric-label">Pedidos neste mês</div><div class="metric">${a.length}</div></div><div class="card"><div class="metric-label">Valor vendido</div><div class="metric">${money(v)}</div></div><div class="card"><div class="metric-label">Sinais registrados</div><div class="metric">${money(sum(a,o=>+o.deposit||0))}</div></div><div class="card"><div class="metric-label">Ticket médio</div><div class="metric">${money(a.length?v/a.length:0)}</div></div></div>`}
function settings(){return head('Dados e backup','Seus dados ficam salvos neste aparelho e sincronizados pelo Firebase.')+`<div class="notice">Use o mesmo login nos aparelhos. Faça backups periódicos como proteção adicional.</div><div class="panel"><h3>Backup dos dados</h3><div class="toolbar"><button class="btn" data-action="backup">Exportar backup</button><label class="btn light" for="restoreFile">Importar backup</label><input class="hidden" type="file" id="restoreFile" accept=".json"></div><p>Ingredientes: ${db.ingredients.length} · Receitas: ${db.recipes.length} · Produtos: ${db.products.length} · Encomendas: ${db.orders.length} · Clientes: ${db.customers.length}</p></div>`}
function field(label,name,val='',type='text',attrs=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val??'')}" ${attrs}></div>`}
function selectField(label,name,opts,val){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${val===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function recipeLine(x){return `<div class="form-grid recipe-line"><div class="field"><label>Ingrediente</label><select name="ingredient"><option value="">Selecione</option>${db.ingredients.map(i=>`<option value="${i.id}" ${x.id===i.id?'selected':''}>${esc(i.name)} (${esc(i.unit)})</option>`).join('')}</select></div><div class="field"><label>Quantidade usada</label><input name="amount" type="number" min="0" step="0.001" value="${x.qty||0}"></div></div>`}
function openForm(type,item=null){
 const x=item||{};let body='';
 if(type==='ingredients')body=`<div class="form-grid">${field('Nome do ingrediente','name',x.name)}${selectField('Unidade','unit',[['g','Gramas (g)'],['kg','Quilogramas (kg)'],['ml','Mililitros (ml)'],['L','Litros (L)'],['un','Unidade']],x.unit||'g')}${field('Quantidade atual','qty',x.qty??0,'number','step="0.001"')}${field('Estoque mínimo','min',x.min??0,'number','step="0.001"')}${field('Custo por unidade (R$)','cost',x.cost??0,'number','step="0.0001"')}${field('Validade','expiry',x.expiry,'date')}</div>`;
 if(type==='recipes')body=`${field('Nome da receita','name',x.name)}${field('Rendimento (unidades)','yield',x.yield??1,'number','min="1"') }<div id="recipeLines">${(x.items||[{id:'',qty:0}]).map(recipeLine).join('')}</div><button class="btn light" type="button" data-action="add-line">＋ Ingrediente</button>`;
 if(type==='products')body=`<div class="form-grid">${field('Nome do produto','name',x.name)}${field('Categoria','category',x.category)}${field('Preço de venda (R$)','price',x.price??0,'number','step="0.01"')}${field('Custo manual (R$)','cost',x.cost??0,'number','step="0.01"')}</div>${selectField('Ficha técnica vinculada','recipeId',[['','Sem receita vinculada'],...db.recipes.map(r=>[r.id,r.name])],x.recipeId||'')}`;
 if(type==='orders')body=`<div class="form-grid">${field('Nome do cliente','customer',x.customer)}${field('Telefone','phone',x.phone)}${field('Produto / bolo','product',x.product)}${field('Data de entrega','date',x.date||today(),'date')}${field('Horário','time',x.time,'time')}${field('Valor total (R$)','total',x.total??0,'number','step="0.01"')}${field('Sinal pago (R$)','deposit',x.deposit??0,'number','step="0.01"')}${selectField('Status','status',['Aguardando','Confirmado','Em produção','Pronto','Entregue','Cancelado'].map(s=>[s,s]),x.status||'Aguardando')}</div><div class="field"><label>Detalhes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>`;
 if(type==='customers')body=`<div class="form-grid">${field('Nome','name',x.name)}${field('Telefone','phone',x.phone)}${field('E-mail','email',x.email)}</div><div class="field"><label>Observações</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>`;
 if(type==='transactions')body=`<div class="form-grid">${field('Descrição','description',x.description)}${field('Valor (R$)','value',x.value??0,'number','step="0.01"')}${selectField('Tipo','type',[['entrada','Entrada'],['saida','Saída']],x.type||'entrada')}${field('Categoria','category',x.category)}${field('Data','date',x.date||today(),'date')}</div>`;
 const names={ingredients:'Ingrediente',recipes:'Receita',products:'Produto',orders:'Encomenda',customers:'Cliente',transactions:'Lançamento'};
 $('#modalTitle').textContent=(x.id?'Editar ':'Novo ')+(names[type]||'cadastro');$('#modalBody').innerHTML=body;$('#modalBack').classList.add('show');
 formSave=()=>{const data=Object.fromEntries(new FormData((()=>{const f=document.createElement('form');f.innerHTML=$('#modalBody').innerHTML;return f})()).entries());
  if(type==='recipes')data.items=[...$('#recipeLines').querySelectorAll('.recipe-line')].map(r=>({id:r.querySelector('[name=ingredient]').value,qty:+r.querySelector('[name=amount]').value||0})).filter(z=>z.id);
  ['qty','min','cost','price','yield','total','deposit','value'].forEach(k=>{if(data[k]!==undefined)data[k]=+data[k]||0});
  const arr=db[type],idx=arr.findIndex(z=>z.id===x.id);if(x.id&&idx>=0)arr[idx]={...x,...data};else arr.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...data});
  if(type==='orders'&&data.customer&&!db.customers.some(c=>c.name.toLowerCase()===data.customer.toLowerCase()))db.customers.push({id:String(Date.now()+1),name:data.customer,phone:data.phone||''});
  $('#modalBack').classList.remove('show');formSave=null;render();
 };
}
function closeModal(){$('#modalBack').classList.remove('show');formSave=null}
$('#saveModal').addEventListener('click',()=>{if(formSave)formSave()});$('#closeModal').addEventListener('click',closeModal);$('#cancelModal').addEventListener('click',closeModal);$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a.startsWith('page:'))setPage(a.split(':')[1]);else if(a.startsWith('create:'))openForm(a.split(':')[1]);else if(a.startsWith('edit:')){const [,t,id]=a.split(':');openForm(t,db[t].find(x=>x.id===id))}else if(a.startsWith('del:')){const [,t,id]=a.split(':');if(confirm('Deseja realmente excluir este registro?')){db[t]=db[t].filter(x=>x.id!==id);render()}}else if(a==='backup')backup();else if(a==='add-line')$('#recipeLines').insertAdjacentHTML('beforeend',recipeLine({id:'',qty:0}))});
document.addEventListener('change',e=>{if(e.target.matches('[data-status]')){const o=db.orders.find(x=>x.id===e.target.dataset.status);if(o){o.status=e.target.value;persist()}}if(e.target.id==='restoreFile')restore(e.target)});
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ivete-confeitados-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(input){const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);db={...blank,...d};persist();render();alert('Backup importado com sucesso.')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(file)}
render();
window.iveteApplyCloudData=data=>{db={...blank,...(data||{})};localStorage.setItem('ivete_data',JSON.stringify(db));render()};
window.iveteSetCloudReady=()=>{cloudReady=true};
</script>
<script type="module" src="./firebase.js"></script>
