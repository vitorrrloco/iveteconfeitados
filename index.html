<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#443344"><link rel="manifest" href="./manifest.json"><title>Ivete Confeitados</title>
<style>
:root{--bg:#f6f5f6;--paper:#fff;--ink:#29232b;--muted:#827984;--line:#eae5eb;--brand:#443344;--pinkbg:#fbf2f6;--green:#26724f;--greenbg:#eaf5ee;--red:#b34455;--redbg:#fff0f1;--amber:#93641b;--amberbg:#fff7e7;--shadow:0 6px 24px #3023300b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{display:flex;min-height:100vh}.sidebar{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 18px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:13px;background:var(--brand);color:white;display:grid;place-items:center;font-weight:850}.brand strong{display:block;color:var(--brand);font-size:14px}.brand small{font-size:11px;color:var(--muted)}.navlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#a196a0;font-weight:800;padding:0 10px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px;border-radius:9px;color:#6c626c;display:flex;gap:11px;align-items:center;width:100%;font-size:13px}.nav button.active,.nav button:hover{background:var(--pinkbg);color:var(--brand);font-weight:750}.main{min-width:0;flex:1}.topbar{height:64px;position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.topbar h2{font-size:14px;color:var(--brand);margin:0}.topgroup{display:flex;align-items:center;gap:10px}.today{background:#f6f2f5;border-radius:30px;padding:7px 10px;color:var(--muted);font-size:10px}.content{max-width:1450px;margin:auto;padding:26px 28px 50px}.menuBtn{display:none}.btn{border:0;border-radius:9px;background:var(--brand);color:#fff;padding:10px 14px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.soft{background:var(--pinkbg);color:var(--brand)}.btn.outline{background:#fff;color:var(--brand);border:1px solid var(--line)}.btn.small{font-size:10px;padding:7px 9px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:19px}.pagehead h1{margin:0 0 4px;color:var(--brand);font-size:24px;letter-spacing:-.04em}.pagehead p{margin:0;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.metriccard,.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);min-width:0}.metriclabel{font-size:10px;color:var(--muted)}.metric{font-size:24px;font-weight:850;color:var(--brand);letter-spacing:-.04em;margin:5px 0 1px}.metricnote{font-size:10px;color:var(--muted)}.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}.panel h3{font-size:14px;color:var(--brand);margin:0 0 13px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panelhead h3{margin:0}.tablewrap{width:100%;overflow:auto}table{border-collapse:collapse;width:100%;min-width:590px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:middle}th{background:#fcfafb;color:#988e98;text-transform:uppercase;letter-spacing:.08em;font-size:9px}td b{color:var(--ink)}.muted{color:var(--muted)}.actions{display:flex;gap:5px;white-space:nowrap}.tiny{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:7px;padding:6px 8px;font-size:10px}.pill{display:inline-flex;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:750;background:#f1edf1;color:#675b68}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:340px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:11px;font-weight:750;color:#625762}.field small,.help{font-size:10px;color:var(--muted)}input,select,textarea{width:100%;min-width:0;border:1px solid #e4dce3;border-radius:8px;padding:10px 11px;background:white;color:var(--ink)}textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.full{grid-column:1/-1}.calcbox{background:#faf6f8;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 13px}.calcbox strong{font-size:20px;color:var(--brand)}.notice{background:var(--amberbg);border:1px solid #f0e1c0;color:#765a21;padding:11px 13px;border-radius:9px;font-size:11px;margin-bottom:13px}.positive{color:var(--green);font-weight:800}.negative{color:var(--red);font-weight:800}.modalback{position:fixed;inset:0;z-index:30;background:#21182199;display:none;align-items:center;justify-content:center;padding:14px}.modalback.show{display:flex}.modal{width:min(680px,100%);max-height:92dvh;overflow:auto;background:white;border-radius:15px;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modalhead h2{font-size:17px;color:var(--brand);margin:0}.close{border:0;background:var(--pinkbg);color:var(--brand);border-radius:8px;padding:8px 10px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:12px}.hidden{display:none!important}#authScreen{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);align-items:center;justify-content:center;padding:18px}#authScreen .panel{width:min(400px,100%);padding:24px}#authScreen h1,#authScreen p{text-align:center}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:40;top:0;bottom:0;left:-270px;width:255px;height:100dvh;transition:left .2s;box-shadow:12px 0 36px #0002}.sidebar.open{left:0}.topbar{height:59px;padding:0 12px}.menuBtn{display:inline-flex;width:36px;height:36px;padding:0}.content{padding:17px 12px 34px}.pagehead h1{font-size:20px}.pagehead .btn{font-size:10px;padding:9px 10px}.cards{gap:8px}.metriccard{padding:12px}.metric{font-size:20px}.panel{padding:13px}.formgrid{grid-template-columns:1fr}.modalback{align-items:flex-end;padding:0}.modal{width:100%;max-height:93dvh;border-radius:16px 16px 0 0;padding:17px 14px calc(14px + env(safe-area-inset-bottom))}.modalfoot{position:sticky;bottom:-14px;background:white}.modalfoot .btn{flex:1}input,select,textarea{font-size:16px;min-height:43px}}
</style></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">IC</div><div><strong>Ivete Confeitados</strong><small>Gestão financeira e estoque</small></div></div>
<div><div class="navlabel">Principal</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">⌂　Painel inicial</button><button data-page="receivables">R$　Contas a receber</button><button data-page="clients">♙　Clientes e devedores</button><button data-page="stock">▦　Estoque e compras</button><button data-page="reports">▥　Relatórios e lucro</button></nav></div><div><div class="navlabel">Sistema</div><nav class="nav"><button data-page="settings">⚙　Backup e configurações</button></nav></div><div class="muted" style="margin-top:auto;padding:12px 8px;border-top:1px solid var(--line);font-size:10px">Controle simples. Dinheiro organizado.</div></aside>
<main class="main"><header class="topbar"><div class="topgroup"><button class="btn soft menuBtn" id="menuBtn">☰</button><h2 id="topTitle">Painel inicial</h2></div><div class="topgroup"><span class="today" id="today"></span><button class="btn soft" id="logoutBtn" style="display:none">Sair</button></div></header><section class="content" id="content"></section></main></div>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Cadastro</h2><button class="close" id="closeModal">Fechar</button></div><div id="modalBody"></div><div class="modalfoot"><button class="btn outline" id="cancelModal">Cancelar</button><button class="btn" id="saveModal">Salvar</button></div></div></div>
<div id="authScreen"><div class="panel"><div class="logo" style="margin:auto">IC</div><h1 style="color:var(--brand)">Ivete Confeitados</h1><p class="muted">Entre para acessar a gestão.</p><div class="field"><label>E-mail</label><input id="authEmail" type="email"></div><div class="field"><label>Senha</label><input id="authPassword" type="password"></div><div id="authError" style="color:var(--red);font-size:11px"></div><button class="btn" id="loginBtn" style="width:100%">Entrar</button><button class="btn soft" id="registerBtn" style="width:100%;margin-top:8px">Criar conta</button></div></div>
<script>
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),today=()=>new Date().toISOString().slice(0,10),money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dateBR=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—',blank={clients:[],receivables:[],stock:[],payments:[]};
function norm(d){return {...blank,...(d||{})}}function load(){try{return norm(JSON.parse(localStorage.getItem('ivete_novo_data')||'{}'))}catch(e){return norm({})}}
let db=load(),page='dashboard',saveAction=null,cloudReady=false;
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem('ivete_novo_data',JSON.stringify(db));if(cloudReady&&window.iveteCloudSave)window.iveteCloudSave(db)}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}function left(r){return Math.max(0,(+r.amount||0)-(+r.paid||0))}function client(id){return db.clients.find(c=>c.id===id)}function debt(id){return sum(db.receivables.filter(r=>r.clientId===id&&r.status!=='Cancelado'),left)}function stockValue(){return sum(db.stock,i=>(+i.qty||0)*(+i.cost||0))}function potential(){return sum(db.stock,i=>(+i.qty||0)*((+i.price||0)-(+i.cost||0)))}
const titles={dashboard:'Painel inicial',receivables:'Contas a receber',clients:'Clientes e devedores',stock:'Estoque e compras',reports:'Relatórios e lucro',settings:'Backup e configurações'};
function setPage(p){if(!titles[p])return;page=p;$('#sidebar').classList.remove('open');$('#topTitle').textContent=titles[p];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#today').textContent=new Date().toLocaleDateString('pt-BR');
function head(t,d,button,act){return `<div class="pagehead"><div><h1>${t}</h1><p>${d}</p></div>${button?`<button class="btn" data-action="${act}">＋ ${button}</button>`:''}</div>`}
function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function empty(s){return `<div class="empty">${s}</div>`}
function stats(){let o=db.receivables.filter(r=>r.status!=='Cancelado'&&left(r)>0),month=today().slice(0,7);return {open:sum(o,left),late:sum(o.filter(r=>r.due<today()),left),paid:sum(db.payments.filter(p=>p.date?.startsWith(month)),p=>+p.amount||0),stock:stockValue(),profit:potential(),count:o.length}}
function render(){persist();$('#content').innerHTML=({dashboard,receivables:receivablesPage,clients:clientsPage,stock:stockPage,reports:reportsPage,settings:settingsPage})[page]()}
function dashboard(){let t=stats(),due=db.receivables.filter(r=>r.status!=='Cancelado'&&left(r)>0).sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,6);return head('Painel inicial','O que falta receber, o que já entrou e quanto vale seu estoque.','Nova cobrança','new:receivable')+`<div class="cards"><div class="metriccard"><div class="metriclabel">Total a receber</div><div class="metric">${money(t.open)}</div><div class="metricnote">${t.count} cobranças abertas</div></div><div class="metriccard"><div class="metriclabel">Valores vencidos</div><div class="metric negative">${money(t.late)}</div><div class="metricnote">Cobranças fora do prazo</div></div><div class="metriccard"><div class="metriclabel">Recebido neste mês</div><div class="metric positive">${money(t.paid)}</div><div class="metricnote">Pagamentos registrados</div></div><div class="metriccard"><div class="metriclabel">Valor investido no estoque</div><div class="metric">${money(t.stock)}</div><div class="metricnote">Custo atual dos itens</div></div></div><div class="grid2"><div class="panel"><div class="panelhead"><h3>Próximos recebimentos</h3><button class="btn soft small" data-action="page:receivables">Ver todos</button></div>${table(['Cliente / pagador','Vencimento','Falta receber','Situação'],due.map(r=>`<tr><td><b>${esc(client(r.clientId)?.name||'Cliente')}</b><br><span class="muted">Pagador: ${esc(r.payer||'—')}</span></td><td>${dateBR(r.due)}</td><td><b>${money(left(r))}</b></td><td><span class="pill ${r.due<today()?'red':'amber'}">${r.due<today()?'Vencido':'Pendente'}</span></td></tr>`).join('')||'')}</div><div class="panel"><h3>Lucro potencial do estoque</h3><div class="metric positive">${money(t.profit)}</div><p class="muted">Estimativa bruta se todo o estoque for vendido pelo preço previsto. Não é lucro realizado.</p><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:16px"><button class="btn soft small" data-action="new:stock">Adicionar estoque</button><button class="btn outline small" data-action="new:client">Novo cliente</button></div></div></div>`}
function receivablesPage(){let rows=db.receivables.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(r=>`<tr><td><b>${esc(client(r.clientId)?.name||'Cliente')}</b><br><span class="muted">Pagador: ${esc(r.payer||'—')}</span></td><td>${esc(r.description||'—')}</td><td>${dateBR(r.due)}</td><td>${money(r.amount)}</td><td>${money(r.paid)}</td><td><b>${money(left(r))}</b></td><td><span class="pill ${left(r)===0?'green':r.due<today()?'red':'amber'}">${left(r)===0?'Pago':r.due<today()?'Vencido':'Pendente'}</span></td><td><div class="actions">${left(r)>0?`<button class="tiny" data-action="pay:${r.id}">Receber</button>`:''}<button class="tiny" data-action="edit:receivable:${r.id}">Editar</button><button class="tiny" data-action="delete:receivable:${r.id}">Excluir</button></div></td></tr>`);return head('Contas a receber','Cadastre quem deve, quem vai pagar e marque pagamentos totais ou parciais.','Nova cobrança','new:receivable')+`<div class="notice">Este sistema não registra vendas. Aqui você controla somente valores que precisa receber.</div><div class="toolbar"><input id="searchTable" placeholder="Buscar cliente ou pagador..."></div><div class="panel">${table(['Cliente / pagador','Descrição','Vencimento','Valor original','Recebido','Saldo','Status','Ações'],rows.join('')||'')}</div>`}
function clientsPage(){let rows=db.clients.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.phone||'')}</span></td><td>${money(debt(c.id))}</td><td>${money(sum(db.payments.filter(p=>p.clientId===c.id),p=>+p.amount||0))}</td><td>${db.receivables.filter(r=>r.clientId===c.id&&left(r)>0).length}</td><td><div class="actions"><button class="tiny" data-action="detail:${c.id}">Histórico</button><button class="tiny" data-action="edit:client:${c.id}">Editar</button><button class="tiny" data-action="delete:client:${c.id}">Excluir</button></div></td></tr>`);return head('Clientes e devedores','Veja quanto cada cliente deve, quanto já pagou e o histórico.','Novo cliente','new:client')+`<div class="cards"><div class="metriccard"><div class="metriclabel">Clientes</div><div class="metric">${db.clients.length}</div></div><div class="metriccard"><div class="metriclabel">Clientes devedores</div><div class="metric">${db.clients.filter(c=>debt(c.id)>0).length}</div></div><div class="metriccard"><div class="metriclabel">Total em aberto</div><div class="metric">${money(sum(db.clients,c=>debt(c.id)))}</div></div><div class="metriccard"><div class="metriclabel">Total recebido</div><div class="metric positive">${money(sum(db.payments,p=>+p.amount||0))}</div></div></div><div class="panel">${table(['Cliente','Ainda deve','Já pagou','Cobranças abertas','Ações'],rows.join('')||'')}</div>`}
function stockPage(){let rows=db.stock.map(i=>{let prof=(+i.price||0)-(+i.cost||0);return `<tr><td><b>${esc(i.name)}</b><br><span class="muted">${esc(i.category||'')}</span></td><td>${i.qty} ${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${money(i.price)}</td><td>${money((+i.qty||0)*(+i.cost||0))}</td><td class="${prof>=0?'positive':'negative'}">${money(prof)}</td><td><div class="actions"><button class="tiny" data-action="edit:stock:${i.id}">Editar</button><button class="tiny" data-action="restock:${i.id}">Repor</button><button class="tiny" data-action="delete:stock:${i.id}">Excluir</button></div></td></tr>`});return head('Estoque e compras','Adicione itens, registre reposições e acompanhe custo e lucro estimado.','Adicionar item','new:stock')+`<div class="cards"><div class="metriccard"><div class="metriclabel">Itens cadastrados</div><div class="metric">${db.stock.length}</div></div><div class="metriccard"><div class="metriclabel">Valor investido</div><div class="metric">${money(stockValue())}</div></div><div class="metriccard"><div class="metriclabel">Lucro potencial bruto</div><div class="metric positive">${money(potential())}</div></div><div class="metriccard"><div class="metriclabel">Unidades em estoque</div><div class="metric">${sum(db.stock,i=>+i.qty||0).toLocaleString('pt-BR')}</div></div></div><div class="notice">Lucro potencial = (preço previsto − custo unitário) × quantidade. É uma estimativa, não venda nem lucro realizado.</div><div class="toolbar"><input id="searchTable" placeholder="Buscar item..."></div><div class="panel">${table(['Item','Quantidade','Custo unitário','Preço previsto','Valor em estoque','Lucro por unidade','Ações'],rows.join('')||'')}</div>`}
function reportsPage(){let t=stats(),items=db.stock.slice().sort((a,b)=>(b.price-b.cost)-(a.price-a.cost));return head('Relatórios e lucro','Resumo de recebimentos, atrasos e rentabilidade estimada.')+`<div class="cards"><div class="metriccard"><div class="metriclabel">A receber</div><div class="metric">${money(t.open)}</div></div><div class="metriccard"><div class="metriclabel">Vencido</div><div class="metric negative">${money(t.late)}</div></div><div class="metriccard"><div class="metriclabel">Recebido no mês</div><div class="metric positive">${money(t.paid)}</div></div><div class="metriccard"><div class="metriclabel">Lucro potencial</div><div class="metric positive">${money(t.profit)}</div></div></div><div class="panel"><h3>Rentabilidade estimada por item</h3>${table(['Item','Qtd.','Custo','Preço previsto','Lucro unitário','Lucro potencial'],items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${money(i.price)}</td><td>${money(i.price-i.cost)}</td><td>${money(i.qty*(i.price-i.cost))}</td></tr>`).join('')||'')}</div>`}
function settingsPage(){return head('Backup e configurações','Exporte uma cópia de segurança dos dados.')+`<div class="notice">O novo sistema usa estrutura própria de clientes, cobranças, estoque e pagamentos. Exporte os dados antigos antes de instalar esta versão.</div><div class="panel"><h3>Backup completo</h3><div class="toolbar"><button class="btn" data-action="backup">Exportar backup JSON</button><label class="btn soft" for="restoreFile">Importar backup</label><input id="restoreFile" class="hidden" type="file" accept=".json"></div><p class="muted">Clientes: ${db.clients.length} · Cobranças: ${db.receivables.length} · Estoque: ${db.stock.length} · Pagamentos: ${db.payments.length}</p></div>`}
function fld(label,name,val='',type='text',attrs=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val??'')}" ${attrs}></div>`}function sel(label,name,opts,val){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(val??'')===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function openForm(type,x=null){x=x||{};let body='';
if(type==='client')body=`<div class="formgrid">${fld('Nome do cliente','name',x.name)}${fld('Telefone / WhatsApp','phone',x.phone)}${fld('E-mail (opcional)','email',x.email)}<div class="field full"><label>Observações</label><textarea name="notes">${esc(x.notes||'')}</textarea></div></div>`;
if(type==='receivable')body=`<div class="notice">Informe o cliente e o nome de quem ficará responsável pelo pagamento. Depois registre quem realmente pagou.</div><div class="formgrid">${sel('Cliente','clientId',[['','Selecione'],...db.clients.map(c=>[c.id,c.name])],x.clientId)}${fld('Nome de quem vai pagar','payer',x.payer)}${fld('Descrição / motivo','description',x.description)}${fld('Valor combinado (R$)','amount',x.amount??'','number','min="0.01" step="0.01"')}${fld('Vencimento','due',x.due||today(),'date')}${fld('Observação','notes',x.notes)}</div>`;
if(type==='payment')body=`<div class="calcbox"><div class="metriclabel">Saldo a receber</div><strong>${money(left(x))}</strong><div class="metricnote">${esc(client(x.clientId)?.name||'Cliente')} · Pagador previsto: ${esc(x.payer||'—')}</div></div><div class="formgrid">${fld('Valor recebido agora (R$)','amount',left(x),'number','min="0.01" step="0.01"')}${fld('Nome de quem pagou','payer',x.payer)}${fld('Data do recebimento','date',today(),'date')}${sel('Forma de pagamento','method',[['Pix','Pix'],['Dinheiro','Dinheiro'],['Cartão','Cartão'],['Transferência','Transferência'],['Outro','Outro']],'Pix')}</div><div class="field"><label>Observação</label><textarea name="notes"></textarea></div>`;
if(type==='stock')body=`<div class="formgrid">${fld('Nome do item','name',x.name)}${sel('Categoria','category',[['Produto','Produto'],['Ingrediente','Ingrediente'],['Embalagem','Embalagem'],['Outro','Outro']],x.category||'Produto')}${fld('Quantidade disponível','qty',x.qty??'','number','min="0" step="0.001"')}${fld('Unidade (un., kg, g, pacote...)','unit',x.unit||'un.')}${fld('Custo unitário (R$)','cost',x.cost??'','number','min="0" step="0.0001"')}${fld('Preço previsto por unidade (R$)','price',x.price??'','number','min="0" step="0.01"')}${fld('Estoque mínimo','min',x.min??0,'number','min="0" step="0.001"')}${fld('Fornecedor','supplier',x.supplier)}</div><div class="calcbox"><div class="metriclabel">Valor investido</div><strong id="sv">${money((+x.qty||0)*(+x.cost||0))}</strong><div class="metriclabel" style="margin-top:8px">Lucro potencial</div><strong id="sp">${money((+x.qty||0)*((+x.price||0)-(+x.cost||0)))}</strong></div>`;
if(type==='restock')body=`<div class="calcbox"><div class="metriclabel">Item</div><strong>${esc(x.name)}</strong><div class="metricnote">Saldo atual: ${x.qty} ${esc(x.unit)}</div></div><div class="formgrid">${fld('Quantidade adicionada','qty','','number','min="0.001" step="0.001"')}${fld('Custo total desta compra (R$)','totalCost','','number','min="0" step="0.01"')}${fld('Fornecedor','supplier',x.supplier)}</div><p class="help">O sistema soma a quantidade e calcula o custo médio ponderado.</p>`;
$('#modalTitle').textContent=({client:x.id?'Editar cliente':'Novo cliente',receivable:x.id?'Editar cobrança':'Nova cobrança',payment:'Registrar recebimento',stock:x.id?'Editar item de estoque':'Adicionar item',restock:'Registrar reposição'})[type];$('#modalBody').innerHTML=body;$('#modalBack').classList.add('show');saveAction=()=>saveForm(type,x);if(type==='stock'){['qty','cost','price'].forEach(n=>$('#modalBody [name='+n+']').addEventListener('input',()=>{$('#sv').textContent=money((+$('#modalBody [name=qty]').value||0)*(+$('#modalBody [name=cost]').value||0));$('#sp').textContent=money((+$('#modalBody [name=qty]').value||0)*((+$('#modalBody [name=price]').value||0)-(+$('#modalBody [name=cost]').value||0)))}))}}
function saveForm(type,x){let f=document.createElement('form');f.innerHTML=$('#modalBody').innerHTML;let d=Object.fromEntries(new FormData(f).entries());
if(type==='client'){if(!d.name?.trim())return alert('Informe o nome do cliente.');let i=db.clients.findIndex(c=>c.id===x.id);if(i>=0)db.clients[i]={...x,...d};else db.clients.push({id:uid(),...d})}
if(type==='receivable'){if(!d.clientId)return alert('Selecione um cliente.');if((+d.amount||0)<=0)return alert('Informe um valor maior que zero.');let rec={...x,...d,amount:+d.amount,paid:+x.paid||0};let i=db.receivables.findIndex(r=>r.id===x.id);if(i>=0)db.receivables[i]=rec;else db.receivables.push({id:uid(),...rec,status:'Pendente'})}
if(type==='payment'){let v=+d.amount||0;if(v<=0||v>left(x)+.00001)return alert('O pagamento deve ser maior que zero e não pode ultrapassar o saldo.');db.payments.push({id:uid(),receivableId:x.id,clientId:x.clientId,amount:v,payer:d.payer,date:d.date,method:d.method,notes:d.notes});let r=db.receivables.find(r=>r.id===x.id);r.paid=(+r.paid||0)+v;r.payer=d.payer||r.payer;r.status=left(r)<=0?'Pago':'Parcial'}
if(type==='stock'){if(!d.name?.trim())return alert('Informe o nome do item.');let item={...x,...d,qty:+d.qty||0,cost:+d.cost||0,price:+d.price||0,min:+d.min||0};let i=db.stock.findIndex(s=>s.id===x.id);if(i>=0)db.stock[i]=item;else db.stock.push({id:uid(),...item})}
if(type==='restock'){let q=+d.qty||0,total=+d.totalCost||0;if(q<=0||total<0)return alert('Informe quantidade e custo total.');let i=db.stock.findIndex(s=>s.id===x.id),old=db.stock[i],nq=(+old.qty||0)+q;db.stock[i]={...old,qty:nq,cost:( (+old.qty||0)*(+old.cost||0)+total)/nq,supplier:d.supplier||old.supplier}}
closeModal();render()}
function closeModal(){$('#modalBack').classList.remove('show');saveAction=null;$('#saveModal').classList.remove('hidden')}$('#saveModal').onclick=()=>saveAction?.();$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function detail(id){let c=client(id),rs=db.receivables.filter(r=>r.clientId===id),ps=db.payments.filter(p=>p.clientId===id);$('#modalTitle').textContent='Histórico: '+c.name;$('#modalBody').innerHTML=`<div class="cards"><div class="metriccard"><div class="metriclabel">Ainda deve</div><div class="metric">${money(debt(id))}</div></div><div class="metriccard"><div class="metriclabel">Já pagou</div><div class="metric positive">${money(sum(ps,p=>+p.amount||0))}</div></div></div><h3>Cobranças</h3>${table(['Descrição','Vencimento','Valor','Recebido','Saldo'],rs.map(r=>`<tr><td>${esc(r.description)}</td><td>${dateBR(r.due)}</td><td>${money(r.amount)}</td><td>${money(r.paid)}</td><td>${money(left(r))}</td></tr>`).join('')||'')}<h3 style="margin-top:18px">Pagamentos</h3>${table(['Data','Quem pagou','Forma','Valor'],ps.map(p=>`<tr><td>${dateBR(p.date)}</td><td>${esc(p.payer)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td></tr>`).join('')||'')}`;$('#modalBack').classList.add('show');$('#saveModal').classList.add('hidden')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a.startsWith('page:'))setPage(a.split(':')[1]);else if(a.startsWith('new:'))openForm(a.split(':')[1]);else if(a.startsWith('edit:')){let [,t,id]=a.split(':'),map={client:'clients',receivable:'receivables',stock:'stock'};openForm(t,db[map[t]].find(x=>x.id===id))}else if(a.startsWith('pay:'))openForm('payment',db.receivables.find(r=>r.id===a.split(':')[1]));else if(a.startsWith('detail:'))detail(a.split(':')[1]);else if(a.startsWith('restock:'))openForm('restock',db.stock.find(i=>i.id===a.split(':')[1]));else if(a.startsWith('delete:')){let [,t,id]=a.split(':');if(!confirm('Excluir este registro?'))return;if(t==='client'){if(db.receivables.some(r=>r.clientId===id))return alert('Este cliente tem cobranças vinculadas.');db.clients=db.clients.filter(c=>c.id!==id)}if(t==='receivable'){db.receivables=db.receivables.filter(r=>r.id!==id);db.payments=db.payments.filter(p=>p.receivableId!==id)}if(t==='stock')db.stock=db.stock.filter(i=>i.id!==id);render()}else if(a==='backup'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='ivete-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}});
document.addEventListener('input',e=>{if(e.target.id==='searchTable'){let q=e.target.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(q)))}});document.addEventListener('change',e=>{if(e.target.id==='restoreFile'){let f=e.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{db=norm(JSON.parse(rd.result));persist();render();alert('Backup importado.')}catch(e){alert('Arquivo inválido.')}};rd.readAsText(f)}});
render();window.iveteApplyCloudData=data=>{db=norm(data||{});localStorage.setItem('ivete_novo_data',JSON.stringify(db));render()};window.iveteSetCloudReady=()=>{cloudReady=true};
</script><script type="module" src="./firebase.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker:',e)));}</script></body></html>
